# Which files sops encrypts, and to whose key.
#
# The regex is what decides whether the status bar offers to encrypt a
# plaintext file: `secrets-dev.yaml` and `secrets-new.yaml` match it,
# `config.yaml` and `.env` do not. It is matched against the path as the
# project sees it, so it works whether this folder is opened on its own or
# from the top of the repository.
creation_rules:
  - path_regex: secrets-[a-z]+\.(yaml|json|env|ini)$
    age: age1l2qk9tsul5usxc5pltq5qvm5wezejjeszju3855ymym3c23vmynq77pmpd
